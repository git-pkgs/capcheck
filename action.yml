name: go-capcheck
description: Fail CI when Go code or dependencies gain new privileged operations, using google/capslock
author: git-pkgs
branding:
  icon: lock
  color: blue

inputs:
  go-version:
    description: Go version to install (passed to actions/setup-go)
    required: false
    default: stable
  capcheck-version:
    description: capcheck version to install
    required: false
    default: latest
  working-directory:
    description: Directory containing the Go module
    required: false
    default: .
  packages:
    description: Whitespace-separated Go package patterns to analyse
    required: false
    default: ./...
  config:
    description: Path to capcheck.json
    required: false
    default: ""
  baseline:
    description: Path to capcheck.lock.json (overrides config)
    required: false
    default: ""
  strict:
    description: Fail on removed capabilities as well as added
    required: false
    default: "false"
  ignore:
    description: Comma-separated capabilities to ignore (stacks with capcheck.json)
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version: ${{ inputs.go-version }}

    - name: Install capcheck
      shell: bash
      env:
        CAPCHECK_VERSION: ${{ inputs.capcheck-version }}
      run: go install "github.com/git-pkgs/capcheck/cmd/capcheck@${CAPCHECK_VERSION}"

    - name: Run capcheck
      id: check
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CONFIG: ${{ inputs.config }}
        BASELINE: ${{ inputs.baseline }}
        STRICT: ${{ inputs.strict }}
        IGNORE: ${{ inputs.ignore }}
        PACKAGES: ${{ inputs.packages }}
      run: |
        set +e
        args=(check --format github)
        if [ -n "$CONFIG" ]; then
          args+=(--config "$CONFIG")
        fi
        if [ -n "$BASELINE" ]; then
          args+=(--baseline "$BASELINE")
        fi
        if [ "$STRICT" = "true" ]; then
          args+=(--strict)
        fi
        if [ -n "$IGNORE" ]; then
          args+=(--ignore "$IGNORE")
        fi
        read -r -a packages <<< "${PACKAGES//$'\n'/ }"
        capcheck "${args[@]}" -- "${packages[@]}"
        code=$?
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        exit 0

    - name: Job summary
      if: steps.check.outputs.exit-code != '0'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CONFIG: ${{ inputs.config }}
        BASELINE: ${{ inputs.baseline }}
        PACKAGES: ${{ inputs.packages }}
      run: |
        args=(check)
        if [ -n "$CONFIG" ]; then
          args+=(--config "$CONFIG")
        fi
        if [ -n "$BASELINE" ]; then
          args+=(--baseline "$BASELINE")
        fi
        read -r -a packages <<< "${PACKAGES//$'\n'/ }"
        {
          echo '### capcheck'
          echo
          echo '```'
          capcheck "${args[@]}" -- "${packages[@]}" || true
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Fail if changed
      if: steps.check.outputs.exit-code != '0'
      shell: bash
      env:
        EXIT_CODE: ${{ steps.check.outputs.exit-code }}
      run: exit "$EXIT_CODE"
